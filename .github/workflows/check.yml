name: check

on:
  push:
    branches:
      - mainframe
      - "feat/**"
  pull_request:
    branches:
      - mainframe

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run source, type, test, lint, format, and build checks
        run: npm run check

      - name: Show canonical formatting diff after a failed check
        if: failure()
        run: |
          npm run format:apply
          git diff --no-color -- . ":!package-lock.json"

      - name: Validate Cloudflare deployment boundary
        run: npm run deploy -- --dry-run
